<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes – Dashboard</title><link rel="stylesheet" href="static/style.css"></head><body><nav><img src="static/icon.png"><b>Hermes</b><span class="sp"></span><a href="dashboard.html">Dashboard</a><a href="upload.html">Upload</a></nav>
<div class="wrap"><div class="card prof"><img id="av"><div><div style="font-size:22px;font-weight:700" id="dn"></div><div style="color:#a99cc8" id="un"></div>
<div class="stats"><div><b id="fo"></b><span>Followers</span></div><div><b id="fg"></b><span>Following</span></div><div><b id="li"></b><span>Likes</span></div><div><b id="vc"></b><span>Videos</span></div></div></div>
<span class="pill g">✓ Connected with TikTok</span></div>
<div style="display:flex;align-items:center;gap:10px"><h2 style="flex:1">Your videos</h2><a class="btn g" href="upload.html" style="margin:0;padding:10px 18px;font-size:15px">+ Post a video</a></div>
<div class="vids" id="vids"></div></div>
<script>fetch('data.json').then(r=>r.json()).then(d=>{const u=d.user;av.src=u.avatar;dn.textContent=u.display_name;un.textContent='@'+u.username;fo.textContent=u.follower_count;fg.textContent=u.following_count;li.textContent=u.likes_count;vc.textContent=u.video_count;
vids.innerHTML=d.videos.map(v=>'<a class="v" target="_blank" style="color:#fff;text-decoration:none" href="'+v.url+'"><img src="'+v.cover+'"><div>'+v.title+'<br><small>▶ '+v.views+' · ♥ '+v.likes+' · '+new Date(v.create_time*1000).toLocaleDateString()+'</small></div></a>').join('')})</script></body></html>
